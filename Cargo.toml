[package]
name = "automaton"
version = "0.1.0"
edition = "2024"
description = "1D elementary cellular automaton simulator that renders Wolfram rules to PNG"
license = "MIT"
repository = "https://github.com/renvk/automaton"

[dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
